*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#08090b}
body{font-family:"Inter Variable",Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;text-rendering:geometricPrecision}
#stage{position:absolute;inset:0;width:1920px;height:1080px;background:#08090b;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:960px 540px}
.abs{position:absolute}
svg.ic{display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- window ---------- */
#win{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg)}
#winBg{position:absolute;inset:0;background:var(--bg)}
#tileBg{position:absolute;inset:0;background:linear-gradient(135deg,#7B93FF,#4A3FD9)}
#tileBg::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:#fff;opacity:.06}
#glyph{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px}
#glyph svg{width:200px;height:200px;display:block;overflow:visible}
#collapseAv{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px}
#collapseAv img{position:absolute;inset:0;width:100%;height:100%}
#uiWrap{position:absolute;left:50%;top:50%;width:1680px;height:945px;margin:-472.5px 0 0 -840px}
#ui{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;transform:scale(1.166667);background:var(--bg);overflow:hidden}
#phoneWrap{position:absolute;left:50%;top:50%;width:430px;height:880px;margin:-440px 0 0 -215px}
/* ---------- shared ui ---------- */
.avatar{position:absolute;border-radius:50%}
.avatar img{position:absolute;inset:0;width:100%;height:100%;display:block}
.crown{position:absolute;left:50%;top:-30%;transform:translateX(-50%) rotate(-8deg);color:var(--warning);display:grid;place-items:center;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-sidebar);opacity:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--warning-soft);color:var(--warning)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mut{background:var(--surface-2);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);font-size:12px;color:var(--text-2);white-space:nowrap}
.chip b{color:var(--text);font-weight:650}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:550;border:1px solid var(--border);background:var(--surface-2);color:var(--text);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.card{position:absolute;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--mono)}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
/* ---------- sidebar ---------- */
#sb{position:absolute;left:0;top:0;width:272px;height:810px;background:var(--bg-sidebar);border-right:1px solid var(--border)}
.sbrow{position:absolute;left:8px;width:256px;height:52px;border-radius:var(--r)}
.sbrow .nm{position:absolute;left:52px;top:8px;font-size:14px;font-weight:600;white-space:nowrap}
.sbrow .pv{position:absolute;left:52px;top:27px;width:188px;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:absolute;left:8px;width:256px;height:33px;display:flex;align-items:center;gap:12px;padding-left:12px;color:var(--text-2);font-size:14px;font-weight:500}
.nav svg{width:16px;height:16px}
.badge{position:absolute;right:10px;top:7px;min-width:20px;height:20px;border-radius:10px;background:var(--warning);color:#1a1300;font-size:11px;font-weight:700;display:grid;place-items:center}
/* ---------- main / chat ---------- */
#main{position:absolute;left:272px;top:0;width:1168px;height:810px;overflow:hidden;background:var(--bg)}
.view{position:absolute;left:0;top:0;width:1168px;height:810px}
.hdr-name{position:absolute;font-size:15px;font-weight:650}
.hdr-sub{position:absolute;font-size:13px;color:var(--text-2);white-space:nowrap}
.tab{position:absolute;font-size:14px;font-weight:500;color:var(--text-2)}
.bubble-user{position:absolute;background:var(--user-bubble);color:var(--user-bubble-fg);border-radius:14px;font-size:14.5px;line-height:1.5;padding:12px 18px;overflow:hidden}
.msgname{font-size:14px;font-weight:650}
.composer{position:absolute;left:224px;top:724px;width:720px;height:50px;border-radius:14px;border:1px solid var(--border-strong);background:var(--bg)}
.sendbtn{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:var(--r-sm);background:var(--surface-3);display:grid;place-items:center;color:var(--text-2)}
.sendbtn svg{width:16px;height:16px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t td,table.t th{border:1px solid var(--border-strong);padding:8px 12px;text-align:left}
table.t th{background:var(--surface-1);font-weight:650}
/* lane cards */
.lane{position:absolute;background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.lane .lhd{position:absolute;left:0;top:0;right:0;height:56px}
.lrow{position:absolute;left:16px;right:16px;height:34px;display:flex;align-items:center;gap:10px;font-size:13px}
.lrow .ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.lrow .tag{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.spin{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent)}
/* approval */
.appr{position:absolute;background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:14px;overflow:hidden}
/* computer */
.chrome{position:absolute;background:#e9ebef;overflow:hidden;border-radius:8px}
.site{position:absolute;background:#fff;color:#1b1d24;font-family:"Inter Variable",sans-serif}
/* caption */
#cap{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:20px;font-weight:550;color:var(--text-2);letter-spacing:-.005em}
#cursor{position:absolute;left:0;top:0;width:28px;height:28px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.big{position:absolute;white-space:nowrap;font-weight:650;letter-spacing:-.02em}

</style></head><body>

/* ============================ view slides (chat → activity → routines) ============================ */
function views(t) {
  const act = T('activity'), rou = T('routines'), rs = T('live') + 0.35, back = T('lock') - 0.5;
  const vC = S(t, 0, [[act, -1168], [rs, -1168], [back, 0]], SPR.panel);
  // hidden repositioning happens while the whole ui is invisible (bar 13)
  const vA = S(t, 1168, [[act, 0], [rou, -1168], [rs, 1168]], SPR.panel);
  const vR = S(t, 1168, [[rou, 0], [rs, 1168]], SPR.panel);
  $('vChat').style.transform = `translateX(${vC.toFixed(2)}px)`;
  $('vAct').style.transform = `translateX(${vA.toFixed(2)}px)`;
  $('vRou').style.transform = `translateX(${vR.toFixed(2)}px)`;
  // ---- activity ----
  swap($('actSub'), t, [[act, 'Nothing needs you']], { bl: 3 });
  appear($('waitEmpty'), t, T('waiting'), 1e9, { d: .16, bl: 4 });
  [['act0', 'res1'], ['act1', 'res2'], ['act2', 'res3']].forEach(([id, c]) => appear($(id), t, T(c), 1e9, { d: .16, bl: 4, dy: 10 }));
  appear($('recLbl'), t, T('res1') - 0.05, 1e9, { d: .14, bl: 3 });
  appear($('actHeld'), t, T('held'), 1e9, { d: .2, bl: 4, dy: 12 });
  // ---- routines ----
  const ri = $('rouItem'); const rk = ramp(t, rou + 0.02, .2); op(ri, rk); ri.style.transform = `translateY(${((1 - stepResp(t - rou, 22, .8)) * -18).toFixed(2)}px) scale(${(0.97 + 0.03 * stepResp(t - rou, 22, .8)).toFixed(3)})`;
  appear($('rouDetail'), t, rou + 0.12, 1e9, { d: .2, bl: 5, dy: 10 });
  const live = T('live'), dry = T('dryclick');
  const modeHtml = t < live ? '<span class="pill acc">Dry run only</span>' : '<span class="pill ok">Live</span>';
  swap($('rouMode'), t, [[0, '<span class="pill acc">Dry run only</span>'], [live, '<span class="pill ok">Live</span>']], { ex: .05, en: .12, bl: 4 });
  swap($('rouPillL'), t, [[0, '<span class="pill acc">Dry run only</span>'], [live, '<span class="pill ok">Live</span>']], { ex: .05, en: .12, bl: 4 });
  const bh = S(t, 100, [[live, 0]], SPR.panel); const ban = $('rouBanner'); ban.style.height = Math.max(0, bh).toFixed(2) + 'px'; op(ban, 1 - ramp(t, live, .16)); ban.style.borderWidth = bh < 2 ? '0' : '1px';
  const shift = S(t, 0, [[live, -116]], SPR.panel);
  $('rouTry').style.top = (192 + shift).toFixed(2) + 'px'; $('rouInstr').style.top = (478 + shift).toFixed(2) + 'px';
  const bl = $('btnLive'); bl.style.transform = `scale(${(1 - 0.06 * Math.exp(-Math.pow((t - live - 0.02) / .04, 2))).toFixed(3)})`;
  const bd = $('btnDry'); bd.style.transform = `scale(${(1 - 0.06 * Math.exp(-Math.pow((t - dry - 0.02) / .04, 2))).toFixed(3)})`;
  bd.style.background = t >= dry && t < T('dryDone') + 0.4 ? 'var(--surface-3)' : 'var(--surface-2)';
  runDefs.forEach((d, i) => {
    const on = T(d[1]), off = T(d[2]);
    const a = ramp(t, on - 0.02, .12); op(d.el, a); d.el.style.transform = `translateY(${((1 - a) * 6).toFixed(1)}px)`;
    d.ico.innerHTML = t >= off ? CHECK() : t >= on ? `<div style="position:absolute;inset:1px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);transform:rotate(${((t - on) * 430) % 360}deg)"></div>` : '';
  });
  appear(runDone, t, T('dryDone'), 1e9, { d: .14, bl: 3 });
}

/* ============================ phone ============================ */
function phone(t) {
  const shrink = T('shrink'), notify = T('notify'), tap = T('tap'), lock = T('lock');
  op(els.phoneWrap, ramp(t, shrink + 0.16, .16) * (1 - ramp(t, lock, .12)));
  const ny = S(t, -100, [[notify, 14], [tap + 0.1, -100]], SPR.pop);
  const nt = $('phNote'); nt.style.top = ny.toFixed(2) + 'px'; nt.style.transform = `scale(${(1 - 0.03 * Math.exp(-Math.pow((t - tap - 0.02) / .06, 2))).toFixed(3)})`;
  const sc = S(t, 0, [[tap + 0.08, -210]], SPR.panel);
  $('phThread').style.transform = `translateY(${sc.toFixed(2)}px)`;
  const enc = $('phEnc'); appear(enc, t, tap + 0.08, 1e9, { d: .14, bl: 3 });
  swap($('phSub'), t, [[0, 'Your first point of contact'], [tap + 0.02, 'Done']], { bl: 3 });
  const pm = $('phMsg'); pm.style.filter = 'none';
}

/* ============================ architecture layer ============================ */
function arch(t, on) {
  const ly = T('layers'), ws = [T('layers'), T('w2'), T('w3'), T('w4')];
  const A = $('arch'); A.style.visibility = on > .002 ? 'visible' : 'hidden';
  op($('archOut'), on * ramp(t, ly - 0.03, .2));
  const lock = T('w4');
  const lp = 1 + 0.25 * Math.exp(-Math.pow((t - lock - 0.05) / .1, 2));
  $('archLbl').style.opacity = (on * ramp(t, ly, .16)).toFixed(3);
  $('archLock').style.transform = `scale(${lp.toFixed(3)})`; $('archLock').style.color = t >= lock ? 'var(--accent)' : 'var(--text-2)'; $('archLock').style.display = 'inline-block';
  // plates: staggered, each with its own offset
  for (let i = 0; i < 4; i++) {
    const p = $('plate' + i), a = ramp(t, ly + 0.05 + i * 0.07, .18) * on;
    op(p, a); p.style.transform = `translateY(${((1 - a) * 14).toFixed(1)}px)`;
    const hl = i === 0 ? Math.max(ramp(t, ws[0], .1) * .6, ramp(t, ws[3], .1)) : i === 1 ? ramp(t, ws[1], .1) : i === 2 ? ramp(t, ws[2], .1) : ramp(t, ws[3], .1);
    p.style.borderColor = `color-mix(in srgb, var(--accent) ${(hl * 100).toFixed(0)}%, var(--border))`;
    if (i < 3) { const ar = $('arr' + i); op(ar, ramp(t, ly + 0.14 + i * 0.07, .16) * on); }
  }
  $('archOut').style.borderColor = `color-mix(in srgb, var(--accent) ${(Math.max(ramp(t, ws[0], .12) * (1 - ramp(t, ws[1], .1)) * .8, ramp(t, ws[3], .12)) * 100).toFixed(0)}%, var(--border-strong))`;
  for (let i = 0; i < 4; i++) {
    const w = $('w' + i); const a = ramp(t, ws[i], .16); const gone = ramp(t, T('w4') + 0.5, .2);
    const cur = i === 3 ? 1 : 1 - ramp(t, ws[i + 1], .2) * 0.55;
    op(w, a * (1 - gone)); w.style.opacity = (a * (1 - gone) * cur).toFixed(3);
    w.style.transform = `translateX(${((1 - a) * -28).toFixed(1)}px)`; w.style.filter = blurCss((1 - a) * 7);
    w.style.color = 'var(--text)';
  }
}

/* ============================ cursor ============================ */
const CLICKS = [T('focus'), T('send'), T('approve'), T('dryclick'), T('live'), T('tap')];
function cursor(t) {
  const send = MAIN(920, 749), comp = MAIN(500, 749), allow = MAIN(99, 660), dry = MAIN(526, 397), lv = MAIN(1048, 221), note = [960, 151];
  const kx = [], ky = [];
  const K = (time, p) => { kx.push([time, p[0]]); ky.push([time, p[1]]); };
  K(T('window') + 0.05, comp); K(T('key3') + 0.02, send);
  K(T('approvalCard') + 0.5, allow);
  K(T('routines') + 0.2, dry); K(T('dryDone') - 0.05, lv);
  K(T('notify') + 0.22, note);
  K(T('collapse') - 0.5, PARK);
  const x = S(t, PARK[0], kx, SPR.cur), y = S(t, PARK[1], ky, SPR.cur);
  const cs = 1 - 0.14 * CLICKS.reduce((a, c) => a + Math.exp(-Math.pow((t - c - 0.035) / 0.05, 2)), 0);
  const c = $('cursor'); c.style.left = (x - 4).toFixed(2) + 'px'; c.style.top = (y - 3).toFixed(2) + 'px';
  c.style.transformOrigin = '4px 3px'; c.style.transform = `scale(${cs.toFixed(3)})`;
  op(c, ramp(t, T('window') + 0.0, .2) * (1 - ramp(t, T('collapse') - 0.15, .35)));
  // click ripple at the hotspot
  let rp = null; for (const cc of CLICKS) if (t >= cc && t < cc + 0.5) rp = cc;
  const R = $('ripple');
  if (rp !== null) { const k = (t - rp) / 0.5, big = rp === T('tap'); R.style.left = x.toFixed(2) + 'px'; R.style.top = y.toFixed(2) + 'px'; R.style.opacity = ((big ? .55 : .35) * (1 - k)).toFixed(3); R.style.transform = `scale(${(0.25 + (big ? 1.2 : .8) * sstep(k)).toFixed(3)})`; R.style.visibility = 'visible'; }
  else { R.style.visibility = 'hidden'; R.style.opacity = 0; }
}

/* ============================ camera & caption ============================ */
function camera(t) {
  const sc = S(t, 1, [[T('team'), .978], [T('computer') - 0.2, 1.035], [T('halt'), 1.04], [T('resume'), .985], [T('activity'), 1.0], [T('shrink'), 1.035], [T('lock'), 1.0]], SPR.cam);
  const tx = S(t, 0, [[T('computer') - 0.2, -14], [T('resume'), 0], [T('routines'), -10], [T('shrink'), 0]], SPR.cam);
  els.cam.style.transform = `translate(${tx.toFixed(2)}px,0) scale(${sc.toFixed(4)})`;
}
function caption(t) {
  swap($('cap'), t, [
    [T('tool'), 'Tools when they need them.'], [T('computer') + 0.02, 'Watch live. Take over anytime.'], [T('halt') - 0.02, ''],
    [T('waiting'), 'Important things interrupt you. Everything else can wait.'], [T('routines') - 0.1, ''],
    [T('dryclick'), 'Turn repeatable work into a routine.'], [T('live') - 0.1, ''],
    [T('tap'), 'Your team stays with you.'], [T('layers') - 0.15, ''],
  ], { bl: 4, ex: .07, en: .12 });
}

window.seek = t => { render(t); return t; };
document.fonts.ready.then(() => { render(0); window.__ready = true; });

</script></body></html>
